<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador de Gotas de Agua</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />
  <!-- Tus estilos -->
  <link rel="stylesheet" href="/Styles/Contactos.css" />
</head>
<body>
 
  <!-- Encabezado -->
  <header class="mi-encabezado text-white p-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="/index.html" class="h4 fw-bold">Drop by Drop</a>
      <nav class="boton-derecha">
        <a href="/index.html" class="text-white me-3 nav-link d-inline">Inicio</a>
        <a href="/pages/proyecto.html" class="text-white me-3 nav-link d-inline">Proyecto</a>
        <a href="/pages/Contactos.html" class="text-white me-3 nav-link d-inline">Contacto</a>
        <a href="/pages/Iniciar-sesion.html" class="btn btn-primary px-3">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <!-- Título -->
  <h1 class="opiniones mt-4">Envíanos tus opiniones</h1>
   
  <!-- Formulario -->
  <form class="formulario-opinion" id="formulario-opinion">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="correo">Correo electrónico:</label>
    <input type="email" id="correo" name="correo" required>

    <label for="opinion">¿Qué opinas del producto?</label>
    <textarea id="opinion" name="opinion" rows="5" required></textarea>

    <button type="submit">Enviar</button>
  </form>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3 mt-5">
    <p>&copy; 2025 Drop by Drop. Todos los derechos reservados.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/javascript/contactos.js"></script>
</body>
</html>
