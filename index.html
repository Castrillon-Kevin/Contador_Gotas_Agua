<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drop by Drop</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Estilos personalizados externos -->
  <link rel="stylesheet" href="/Styles/estilos.css" />
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h4 class="mb-0">💧 Drop by Drop</h4>
      <nav>
        <a href="#sobre" class="text-white me-3">Sobre</a>
        <a href="#contacto" class="text-white">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- CARRUSEL DE IMÁGENES -->
  <div id="carousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/pages/Imagenes/imagenes_agua/carrucel 1.jpg" class="d-block w-100" alt="Vaso con agua">
        <div class="carousel-caption d-none d-md-block">
        </div>
      </div>
      <div class="carousel-item">
        <img src="/pages/Imagenes/imagenes_agua/carrucel 2.jpg" class="d-block w-100" alt="Naturaleza">
        <div class="carousel-caption d-none d-md-block">
        </div>
      </div>
      <div class="carousel-item">
        <img src="/pages/Imagenes/imagenes_agua/carrucel 3.jpg" class="d-block w-100" alt="Naturaleza">
        <div class="carousel-caption d-none d-md-block">
        </div>
      </div>
      <div class="carousel-item">
        <img src="/pages/Imagenes/imagenes_agua/carrucel 4.jpg" class="d-block w-100" alt="Naturaleza">
        <div class="carousel-caption d-none d-md-block">
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- SECCIÓN SOBRE NOSOTROS -->
  <section id="sobre" class="section">
    <h2>Sobre el Proyecto</h2>
    <p>Promovemos el ahorro de agua con conciencia, educación y tecnología.</p>
  </section>

  <!-- SECCIÓN DE LLAMADO A LA ACCIÓN -->
  <section class="section bg-primary text-white">
    <h2>Únete al cambio</h2>
    <p>Ayuda a conservar el agua. ¡Cada gota importa!</p>
    <a href="/pages/Contactos.html" class="btn btn-light mt-3">Contáctanos</a>
  </section>

  <!-- PIE DE PÁGINA -->
  <footer id="contacto">
    <p>© 2025 Drop by Drop</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
